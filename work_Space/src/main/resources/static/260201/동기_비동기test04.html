    <title>동기, 비동기</title>

      /*
              상품을 구매하여 결제까지의 과정
              1) 로그인       ==> 2) 장바구니 담기    ==> 3) 결제하기
              (위 3가지 작업이 모두 비동기로 처리된다.)
          */

      function login(userName, fnPro) {
        setTimeout(() => {
          fnPro(userName);
