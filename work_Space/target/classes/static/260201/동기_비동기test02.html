<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>동기, 비동기</title>
    <script>
      /*
            다음과 같은 작업을 수행하려고 한다.
            1) 게시판의 리스트 가져오기         ==> 시간이 걸리는 작업
            2) 게시판의 리스트 출력하기
        */
      function getBoardList() {
        setTimeout(() => {
          console.log("게시판 리스트 가져오기...");
        }, 2000);
      }
      const test01 = () => {
        getBoardList();

        console.log("게시판 리스트 출력하기...");

        //실행되는 순서 ==> 1) 게시판 리스트 출력하기 2) 게시판 리스트 가져오기
      };

      //문제 해결 방법 ==> '게시판 리스트 출력하기' 부분을 콜백함수로 처리해서
      //                  '게시판 리스트 가져오기' 이후에 실행되도록 한다.

      function getBoardList2(fn){
        setTimeout(()=>{
            console.log("게시판 리스트 가져오기...");

            fn(); //콜백함수 호출 ==> 이 함수에서 '리스트를 출력' 하도록.
        },2000);
      }

      function test02(){
        getBoardList2( function(){
            // 이 부분에서 '리스트 가져오기'이후에 처리할 내용을 작성한다
            console.log("게시판 리스트 출력하기...");
        });

      }
    </script>
  </head>
  <body>
    <form>
      <input type="button" value="게시판 List 처리하기" onclick="test01()" />
      <input type="button" value="게시판 List 처리하기(콜백함수)" onclick="test02()" />
    </form>
  </body>
</html>
