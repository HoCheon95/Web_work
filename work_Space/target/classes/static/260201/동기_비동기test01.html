<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>동기, 비동기</title>
    <script>

        const test01 = () => {
            //동기방식 ==> 정해진 순서대로 한번에 한가지 일을 한다.
            //            (자바스크립트는 싱글 쓰레드 언어이다.
            //            그래서 오래 걸리는 작업(Blocking)이 있을 때 물리하다.)

            console.log("1");
            console.log("2");
            console.log("3");
        }

        function test02(){
            //비동기 방식 => 해당 작업이 끝날 때까지 기다리지 않고 다음으로 제어가 넘어간다.
            //비동기 함수는 Web API 환경으로 넘기고 자바스크립트는 곧바로 다음 작업을 수행한다.
            //(비동기 함수 : setTimeout, setInterval, fetch, Promise, DOM API 등...)
            setTimeout( () =>{
                console.log("1");
            },2000 );
            console.log("2");
            console.log("3");
            
            //비동기 방식의 작업이 실행된 후의 후처리는 콜백함수를 이용해서 처리한다.

            //콜백함수 ==> 함수의 인자값을 주어지는 함수
            //        ==> 함수의 매개변수에 콜백함수를 전달하여 호출하면 이 함수 안에서
            //            콜백함수를 호출해서 실행해 준다.

            //함수의 매개변수에 일반 값을 전달하는 예제
        }

        /* 
        function main(fn){
            console.log(fn);
        }
        main(10);
        main("안녕하세요");
        */

        function main(fn){
            console.log("1");
            fn();
        }

        function test03(){
            //main함수() 호출
            main(function(){
                console.log("2");
            });
            //main()함수 실행 후 처리할 내용
            console.log("3");
        }


    </script>
</head>
<body>
    <form>
        <input type="button" value="동기 방식 확인" onclick="test01()">
        <input type="button" value="비동기 방식 확인" onclick="test02()">
        <input type="button" value="콜백 방식 확인" onclick="test03()">
    </form>
</body>
</html>
