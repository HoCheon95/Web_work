spring.application.name=middle_spring

# 1. Database Connection (sqlmap.xml의 environments 정보)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@127.0.0.1:1521:xe
spring.datasource.username=week
spring.datasource.password=week

# 2. MyBatis Settings (sqlmap.xml의 settings 정보)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.jdbc-type-for-null=null

# 3. Alias & Mapper Path (sqlmap.xml의 typeAliases 및 mappers 정보)
# DTO 패키지 경로를 지정하면 클래스명만으로 Alias 사용 가능
# mybatis.type-aliases-package=com.example.middle_spring.dto
# XML 매퍼 파일 위치 (현재 폴더 구조에 맞춰 수정)
# mybatis.mapper-locations=classpath:mappers/mybatis/*.xml

# JSP 뷰 리졸버 설정
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# 프로젝트 경로 설정 (원하실 경우)
# server.servlet.context-path=/Middle_Project