<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script>

        /*
            비동기 방식은 특정 코드의 실행이 완료될 때까지 기다리지 않고
            다음 코드를 먼저 수행하는 방식이기 때문에, 만일 비동기 작업의 결과에 따라
            다른 작업을 수행해야 할 때는 전통적으로 '콜백함수'를 사용했다.

            하지만 콜백함수를 사용하면 코드가 복잡해지고 가독성이 떨어지는 문제가 있다.
            특히, 여러 개의 비동기 작업을 순차적으로 수행해야 할 때는 콜백함수가 중첩되어
            코드의 깊이가 깊어지는 현상이 발생한다. 이런 현상을 '콜백지옥(Callback hell)'
            이라고 부른다.
            
            이러한 콜백 지옥을 해결하기 위해서 자바스크립트에서는 Promise 객체를 제공해 준다.

        */

        //==================================================================================

        /*
            자바스크립트의 Promise 객체
                - 자바스크립트의 Promise객체는 비동기 작업의 최종 완료 또는 실패를 나타내는 독자적인 객체이다.
                  비동기 작업이 끝날 때까지 결과를 기다리는 것이 아니라, 나중에 결과를 제공하겠다는
                  '약속'을 반환한다는 의미에서 Promise라는 이름으로 지어졌다.

                - Promise의 3가지 상태 ==> Promise객체의 처리 과정을 나타내는 상태를 말한다.
                    1) PendIng(대기)    ==> 처리가 완료되지 않은 상태(처리 진행 중...)
                    2) Fulfilled(이행)  ==> 성공적으로 처리가 완료된 상태
                    3) Rejected(거부)   ==> 처리가 실패로 끝난 상태

        //---------------------------------------------------------------------------------

            Promise 객체의 기본 사용법
                1. Promise 객체 생성
                    Promise객체를 생성하려면 new 키워드와 Promise 생성자 함수를 사용한다.
                    이 때 생성자 함수에 두 개의 매개변수를 가진 콜백함수를 넣게 되는데
                    첫번째 인수는 작업이 성공했을 때 성공(resolve)임을 알려주는 함수이며,
                    두번째 인수는 작업이 실패했을 때 실패(reject)임을 알려주는 오류 함수이다.
                    객체 생성이 완료되면 주어진 '콜백함수'가 자동으로 실행된다.

                2. Promise 객체 처리
                    이렇게 만들어진 Promise객체는 비동기 작업이 완료된 이후에 처리할 다음 작업을 연결 시켜 진행할 수 있다.
                    작업 결과에 따라 'than()'메서드와 catch()메서드를 통해서 성공과 실패에 대한 후속처리를 진행할 수 있다.

                    만일 처리가 성공하여 Promise 객체 내부에서 resolve(data)함수를 호출하게 되면
                    바로 'then()'메서드로 이어져 then()메서드의 콜백함수에서 성공에 대한 추가 처리를 진행한다.
                    이 때 호출한 resolve(data)함수의 매개변수의 값이 then()메서드의 콜백함수의 인자로
                    들어가 then()메서드 내부에서 Promise객체 내부에서 다룬 값을 사용할 수 있다.

                    반대로 처리가 실패하여 Promise 객체 내부에서 reject(error)함수를 호출하게 되면 
                    바로 catch()메서드로 이어져 catch()메서드 이 콜백함수에서 실패에 대한 추가 처리를
                    진행한다.

            형식)
                new Promise( (resolve, reject) => {
                    //이 부분에 비동기 방식의 처리 내용이 들어간다.
                    //~~~

                    if(성공조건){
                        resolve(결과값);
                    }else{
                        resolve(에러값);
                    }
                })
                .then( (결과값이저장될변수) => {
                    //성공했을 때 실행할 콜백함수의 내용들.....
                    ...
                })
                .catch( (에러값이저장될변수) => {
                    //실패했을 때 실행할 콜백함수의 내용들...
                    ...
                })
                .finally( () => {
                    //성공하든 실패하든 무조건 실행될 콜백함수의 내용들...
                    ...
                })

        */

    </script>
</head>
<body>
    
</body>
</html>
