<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ajax객체 - XMLHttpRequest 객체</title>
    <script>
        /*
            - AJAX(Asynchronus JavaScript And XML)
                ==> 비동기 방식으로 서버에 요청하고 그 결과를 응답으로 받아서 화면(페이지)전환 없이 응답 결과를 화면에 적용하는 기술을 말한다.
            
            - Ajax 객체 ==> XMLHttpRequest객체 ==> 서버와 통신을 담당하는 객체

            - 사용 방법 및 순서
            1) XMLHttpRequest 객체 생성
                형식) const 객체변수 = new XMLHttpRequest();

            2) 요청 설정
                형식) 객체변수.open("요청메서드", URL, 비동기여부);
                - 요청메서드 : GET(리소스 취득), POST(생성), PUT(전체교체), PATCH(일부분수정), DELETE(리소스 삭제)
                - URL : 요청을 처리하고 응답을 보내줄 URL주소
                - 비동기여부 : true(기본값), false(비동기 해제 즉, 동기 방식으로 처리된다.)
            
            3) 요청 헤더 설정(생략 가능)
                형식) 객체변수.setRequestHeader("Header_Key값", "Header_Value값");

            4) 응답 확인 및 이벤트 설정
                (1) 객체변수.onreadystatechange = function(){
                    //요청 완료 및 응답 성공 여부 검사
                    if(객체변수.readyState==4 && 객체변수.status==200){
                        //응답이 성공적으로 수신되었을 때의 처리 내용을 작성한다.
                        ~~~
                        
                    }
                }
                
                (2) 객체변수.onload = function(){
                    //응답이 성공적으로 수신되었을 때의 처리 내용을 작성한다.

                    //'객체변수.responseText' 또는 '객체.responseXML'을 이용해서 응답 데이터를 받아서 처리한다.

                    //'객체변수.responseText' ==> 응답 데이터를 'text'형태로 저장하고 있다.

                    //만약 응답 데이터가 JSON구조의 문자열이면 'JSON.parse(객체변수.responseText)'를 이용하여 JavaScript객체로 변환한 후에 사용한다.
                }

                (3) 객체변수.onerror = function(){
                    //오류가 발생했을 때 처리할 내용을 작성한다.
                    ~~~
                }

            5) 요청 전송
                형식1) 객체변수.send() ==> 보통 'GET'방식일 때 사용
                                      ==> 'GET'방식 요청에서 서버로 보낼 데이터가 있으면 URL주소 뒤에 붙여서 전송하고 'send()메서드'에는 아무것도 설정하지 않는다.
                형식2) 객체변수.send(데이터);   ==> 'POST'방식에서 서버로 보낼 데이터가 있을 경우에 사용한다.

            - readyState 값의 종류
            1) 객체변수.UNSENT              (0)     ==> 객체 생성 후 open()메서드 호출 전 상태
            2) 객체변수.OPEND               (1)     ==> open()메서드가 호출된 상태( send()메서드 호출 전)
            3) 객체변수.HEADERS_RECEIVED    (2)     ==> 응답 데이터가 오기 시작하는 상태
                                                        ( send() 메서드 호출 후 status와 header가 수신된 상태)
            4) 객체변수.LOADING             (3)     ==> 응답 데이터를 가져오고 있는 상태
            5) 객체변수.DONE                (4)     ==> 응답 데이터를 모두 가져 온 상태(완료)

            - status (응답 상태 코드)
            예) 200, 404, 500 등...
            - statusText (응답 상태 문자열)
            예) "OK", "Not Found", "Internal Error" 등...
        */
    </script>
</head>
<body>
    
</body>
</html>
