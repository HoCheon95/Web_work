<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>fetch API</title>
    <script>
        /*
            - fetch API
                ==> 서버에 자료를 요청하여 자료를 받아 올 때 사용하는 API(비동기 처리를 한다.)
                ==> XMLHttpRequest객체를 대신한다.
                ==> fetch()함수는 'Promise 객체'를 반환한다.

            형식)
                fetch("URL주소", 옵션)  ==> '옵션'을 생략하면 무조건 'GET'방식이다.

                - 옵션 형식)
                {
                    method : 전송방식,          //(GET, POST, PUT, PATCH, DELETE 등)
                    headers :
                        {
                            "header-key값" : header-Value값
                            예1) 서버로 전송할 데이터를 JSON문자열로 보낼 때
                            "content-type" : "application/json; charset=utf-8"

                            예2) 서버로 전송할 데이터를 파라미터 형식으로 보낼 때(기본값)
                            'constent-type' : 'application/x-www-form-urlencoded'
                        },
                    body : 서버로 전송할 데이터 ...
                }
                
                - body에 요청 본문으로 지정할 수 있는 자료형들...
                    * JSON문자열
                    * FormData객체  ==> 'form/multipart'형태로 데이터를 전송할 때 사용
                    * URLSearchParams ==> 데이터를 'application/x-www-form-urlencoded'형태로 보내기 위해 사용(예 : name=hong&age=30&tel=010-111-111)
            //------------------------------------------------------------------------------------
            
            - 처리하기
            fetch("url주소", 옵션)
            .then(function(response){//변수명 'response'에는 응답 결과가 저장된다.
                응답 데이터를 받아서 처리할 내용들을 기술한다.
                ~~~
            })

            - then()메서드의 콜백함수의 매개변수 'response'에 대하여...
            1) 속성
                - status : 200 (HTTP 상태 코드, 응답 코드)
                - ok     : true (응답 완료 여부를 나타낸다. ==> HTTP 상태 코드가 200 ~ 299 사이 일때 true)
                - statusText : 응답 코드에 대한 문자열
                - headers : 응답 헤더 정보가 저장되어 있다.(Map과 유사한 형태로 저장되어 있다.)
            
            2) 메서드 ==> 본문을 읽을 때 아래의 메서드들 중 하나만 사용할 수 있다.
                      ==> 예) text()메서드를 사용한 후 json()메서드를 사용하면 두 번째 사용되는 json()메서드에서 작업에 실패한다.
                - text() : 응답 데이터를 'text'로 변환하는 메서드
                - json() : json형태의 응답 데이터를 '스크립트용 객체'로 변환하는 메서드
                - formData() : 응답을 FormData 객체 형태로 변환하는 메서드

        */
    </script>
</head>
<body>
    
</body>
</html>
