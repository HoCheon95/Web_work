<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        //text 형태의 데이터를 받아서 처리하기 (보통의 방법)
        document.querySelector("#nontxtBtn").addEventListener("click", function () {
          const xhr = new XMLHttpRequest();
          xhr.open("get", "/json/jsonTest.do?choice=str");

          xhr.send();

          xhr.onload = function () {
            const data = xhr.responseText; //응답 데이터 받기

            //data = "사과/배/복숭아/딸기/포도"
            console.log("data", data);

            const dataArr = data.split("/");
            console.log("dataArr", dataArr);

            let htmlCode = "<ul>";
            dataArr.forEach(function (v, i) {
              htmlCode += "<li>" + v + "</li>";
            });
            htmlCode += "</ul>";

            console.log("htmlCode", htmlCode);

            document.querySelector("#result").innerHTML = htmlCode;
          };
        });

        //text 형태의 데이터 받아서 처리하기 (Promise객체 이용)
        document.querySelector("#txtBtn").addEventListener("click", function () {
          new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("get", "/json/jsonTest.do?choice=str");

            xhr.send();

            xhr.onload = function () {
              resolve(xhr.responseText);
            };

            xhr.onerror = function () {
              reject(new Error("데이터 수신 중 오류 발생!!!"));
            };
          }).then((text) => {
            const dataArr = text.split("/");

            let htmlCode = "<ul>";
            dataArr.forEach(function (v, i) {
              htmlCode += "<li>" + v + "</li>";
            });
            htmlCode += "</ul>";

            console.log("htmlCode", htmlCode);

            document.querySelector("#result").innerHTML = htmlCode;
          });
        });
        //=================================================================
      });
    </script>
  </head>
  <body>
    <form>
      <input type="button" value="text데이터(non Promise)" id="nontxtBtn" />
      <input type="button" value="text데이터" id="txtBtn" />
      <input type="button" value="text데이터" id="txtBtn" />
      <input type="button" value="text데이터" id="txtBtn" />
      <input type="button" value="text데이터" id="txtBtn" />
      <input type="button" value="text데이터" id="txtBtn" />
    </form>
    <hr color="red" />
    <div id="result"></div>
  </body>
</html>
